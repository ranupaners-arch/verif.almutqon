; AL MUTQON - PHP upload limits (web request)
; Batas aplikasi MAX_UPLOAD_BYTES tetap 10 MB; batas PHP diberi jeda di atasnya
; agar PDF hingga 10 MB bisa naik sementara aplikasi menolak yang lebih besar.
upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 20
display_errors = Off
log_errors = On
expose_php = Off
allow_url_include = Off
session.use_strict_mode = 1
